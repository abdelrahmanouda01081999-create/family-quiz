<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تحدي العائلة - اللاعب</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #46178f;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: auto;
      padding: 35px 15px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      color: #222;
      padding: 25px;
      border-radius: 18px;
    }

    label {
      display: block;
      text-align: right;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
      text-align: center;
    }

    #pinInput {
      letter-spacing: 5px;
      font-size: 26px;
      font-weight: bold;
    }

    .join-button {
      width: 100%;
      padding: 17px;
      margin-top: 22px;
      border: none;
      border-radius: 12px;
      background: #26890c;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: white;
      text-decoration: none;
    }

    #gameScreen {
      display: none;
    }

    .player-name {
      margin-bottom: 25px;
      font-size: 20px;
    }

    .message {
      font-size: 24px;
      margin: 25px 0;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .answer {
      height: 145px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 45px;
      font-weight: bold;
      cursor: pointer;
    }

    .red {
      background: #e21b3c;
    }

    .blue {
      background: #1368ce;
    }

    .yellow {
      background: #d89e00;
    }

    .green {
      background: #26890c;
    }

    .answer:active {
      transform: scale(0.96);
    }

    @media (max-width: 420px) {
      .answer {
        height: 125px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎯 تحدي العائلة</h1>

    <div class="subtitle">
      انضم إلى اللعبة
    </div>


    <!-- JOIN SCREEN -->

    <div id="joinScreen">

      <div class="card">

        <label for="pinInput">
          رمز اللعبة
        </label>

        <input
          id="pinInput"
          type="number"
          inputmode="numeric"
          placeholder="123456"
        >


        <label for="nameInput">
          اسمك
        </label>

        <input
          id="nameInput"
          type="text"
          maxlength="20"
          placeholder="مثال: أحمد"
        >


        <button
          id="joinButton"
          class="join-button"
        >
          دخول اللعبة 🚀
        </button>

      </div>

      <a href="index.html" class="back">
        ← العودة للصفحة الرئيسية
      </a>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen">

      <div class="player-name">
        👤 <span id="displayName">اللاعب</span>
      </div>

      <div class="message" id="message">
        استعد للسؤال التالي! 🔥
      </div>


      <div class="answers">

        <button class="answer red" data-answer="0">
          ▲
        </button>

        <button class="answer blue" data-answer="1">
          ◆
        </button>

        <button class="answer yellow" data-answer="2">
          ●
        </button>

        <button class="answer green" data-answer="3">
          ■
        </button>

      </div>

    </div>

  </div>

</body>
</html>
